<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Management Portal</title>
  <style>
    :root {
      --bg: #eef4ff;
      --panel: #ffffff;
      --panel-soft: #f7f9ff;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #ef4444;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dfe7ff;
      --shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #e0ecff 0%, #f3f6ff 50%, #eef2ff 100%);
      color: var(--text);
    }

    button, input, select {
      font: inherit;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 28px;
    }
    .screen.active { display: block; }

    .login-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .login-card {
      width: min(100%, 420px);
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(148,163,184,0.28);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--primary);
      font-weight: 700;
    }

    h1, h2, h3, h4, p { margin-top: 0; }
    .login-card h1 {
      font-size: clamp(2rem, 3vw, 2.5rem);
      margin-bottom: 8px;
    }

    .subtle {
      color: var(--muted);
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
    }
    .field input, .field select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
    }
    .field input:focus, .field select:focus {
      outline: 2px solid rgba(59,130,246,0.25);
      border-color: var(--primary);
    }

    .primary-btn, .secondary-btn, .ghost-btn {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }
    .primary-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 12px 18px rgba(59,130,246,0.18);
      width: 100%;
    }
    .secondary-btn {
      background: linear-gradient(135deg, #22c55e, #15803d);
      color: white;
    }
    .ghost-btn {
      background: #eef4ff;
      color: var(--primary-dark);
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.7; cursor: wait; }

    .alert {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      margin-top: 18px;
      font-size: 14px;
      font-weight: 600;
    }
    .alert.show { display: block; }
    .alert.error {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }
    .alert.success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .topbar {
      max-width: 1200px;
      margin: 0 auto 20px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(148,163,184,0.2);
      border-radius: 18px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      box-shadow: var(--shadow);
    }

    .brand {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
    }

    .user-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 36px;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 18px;
      margin: 24px 0;
    }

    .stat-card {
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .stat-value {
      font-size: clamp(1.7rem, 2vw, 2.3rem);
      font-weight: 800;
      line-height: 1;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 22px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .list-grid, .card-grid {
      display: grid;
      gap: 14px;
    }
    .card-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .house-card, .tenant-card, .device-card, .profile-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel-soft);
      padding: 16px;
    }

    .house-card h3, .tenant-card h3, .device-card h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }
    .meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .inline-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .mini-btn {
      border: none;
      background: #e0ecff;
      color: var(--primary-dark);
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .mini-btn.danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .profile-card {
      display: grid;
      gap: 10px;
    }
    .profile-line {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(148,163,184,0.25);
    }
    .profile-line:last-child { border-bottom: none; }
    .label { color: var(--muted); }

    .device-status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .device-status.online {
      background: #dcfce7;
      color: #166534;
    }
    .device-status.offline {
      background: #fee2e2;
      color: #991b1b;
    }

    .password-form {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .view-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 18px;
    }

    .view-tab {
      border: 1px solid var(--border);
      background: #f8faff;
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .view-tab.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 18px rgba(59,130,246,0.18);
    }

    .empty {
      border: 1px dashed var(--border);
      border-radius: 16px;
      padding: 22px;
      color: var(--muted);
      text-align: center;
      background: rgba(255,255,255,0.4);
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .dashboard { padding: 0 10px 24px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .view-tabs { margin-top: 10px; }
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="screen active">
    <div class="login-shell">
      <div class="login-card">
        <p class="eyebrow">Rental Management</p>
        <h1>Smart Home Access</h1>
        <p class="subtle">Secure portal for owners, admins, tenants and users.</p>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" value="admin@example.com" autocomplete="email" />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" value="AdminPass123!" autocomplete="current-password" />
        </div>

        <button id="loginBtn" class="primary-btn" type="button">Sign In</button>
        <div id="loginAlert" class="alert error"></div>
      </div>
    </div>
  </div>

  <div id="dashboardScreen" class="screen">
    <header class="topbar">
      <div class="brand">Rental Management Portal</div>
      <div class="user-meta">
        <span id="userRole" class="role-pill">Role</span>
        <strong id="userDisplayName">User</strong>
        <button id="logoutBtn" class="ghost-btn" type="button">Logout</button>
      </div>
    </header>

    <div class="dashboard">
      <div id="statsGrid" class="stat-grid"></div>

      <div id="viewTabs" class="view-tabs" aria-label="Main navigation"></div>

      <div class="layout">
        <section class="panel">
          <div class="panel-header">
            <h2 id="mainPanelTitle">Overview</h2>
            <button id="refreshBtn" class="secondary-btn" type="button">Refresh</button>
          </div>
          <div id="mainPanelContent" class="list-grid"></div>
        </section>

        <aside class="panel">
          <div class="panel-header">
            <h2>Profile</h2>
          </div>
          <div id="profilePanel" class="profile-card"></div>

          <div class="panel-header" style="margin-top:24px;">
            <h2>Change password</h2>
          </div>
          <form id="passwordForm" class="password-form">
            <input id="oldPassword" type="password" placeholder="Current password" />
            <input id="newPassword" type="password" placeholder="New password" />
            <button type="submit" class="primary-btn" style="width:100%;">Update Password</button>
          </form>
          <div id="passwordAlert" class="alert"></div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    function resolveApiBase() {
      const host = window.location.hostname;
      const origin = window.location.origin;

      if (host === 'localhost' || host === '127.0.0.1' || host === '[::1]' || origin.includes('8787')) {
        return origin || 'http://127.0.0.1:8787';
      }

      if (host === 'rental-management.ehexibit.com') {
        return 'https://api.ehexibit.com';
      }

      return origin || 'http://127.0.0.1:8787';
    }

    const API_BASE = resolveApiBase();
    const WS_BASE = API_BASE.replace(/^http/, 'ws');

    const state = {
      jwt: '',
      profile: null,
      role: null,
      houses: [],
      tenants: [],
      selectedHouseId: null,
      devices: [],
      ws: null,
      activeView: 'overview'
    };

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');
    const loginAlert = document.getElementById('loginAlert');
    const passwordAlert = document.getElementById('passwordAlert');
    const mainPanelContent = document.getElementById('mainPanelContent');
    const profilePanel = document.getElementById('profilePanel');
    const statsGrid = document.getElementById('statsGrid');
    const userDisplayName = document.getElementById('userDisplayName');
    const userRole = document.getElementById('userRole');
    const mainPanelTitle = document.getElementById('mainPanelTitle');
    const viewTabs = document.getElementById('viewTabs');

    function showAlert(element, message, type) {
      element.textContent = message;
      element.className = `alert ${type} show`;
    }

    function clearAlert(element) {
      element.textContent = '';
      element.className = 'alert';
    }

    function formatRole(role) {
      return role ? role.toUpperCase() : 'USER';
    }

    function getRoleViews() {
      if (state.role === 'admin' || state.role === 'owner') {
        return ['overview', 'houses', 'tenants', 'devices'];
      }
      return ['overview', 'houses', 'devices'];
    }

    function renderViewTabs() {
      const views = getRoleViews();
      const labels = {
        overview: 'Overview',
        houses: 'Houses',
        tenants: 'Tenants',
        devices: 'Devices'
      };

      viewTabs.innerHTML = views.map(view => `
        <button
          type="button"
          class="view-tab ${state.activeView === view ? 'active' : ''}"
          data-view="${view}"
        >${labels[view]}</button>
      `).join('');

      viewTabs.querySelectorAll('[data-view]').forEach(button => {
        button.addEventListener('click', () => {
          state.activeView = button.dataset.view;
          renderViewTabs();
          renderMainPanel();
        });
      });
    }

    function setActiveScreen(screen) {
      loginScreen.classList.toggle('active', screen === 'login');
      dashboardScreen.classList.toggle('active', screen === 'dashboard');
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });

      const text = await response.text();
      const data = text ? JSON.parse(text) : {};

      if (!response.ok) {
        throw new Error(data.error || data.message || 'Request failed');
      }

      return data;
    }

        function getAuthHeaders() {
      return {
        Authorization: `Bearer ${state.jwt}`,
        'Content-Type': 'application/json'
      };
    }

    function renderStats() {
      const role = state.role;
      let cards = [
        { label: 'Houses', value: state.houses.length },
        { label: 'Tenants', value: state.tenants.length },
        { label: 'Assigned Devices', value: state.devices.length }
      ];

      if (role === 'tenant' || role === 'user') {
        cards = [
          { label: 'Assigned House', value: state.houses.length || 0 },
          { label: 'Devices', value: state.devices.length },
          { label: 'Role', value: formatRole(role).slice(0, 6) }
        ];
      }

      statsGrid.innerHTML = cards.map(card => `
        <div class="stat-card">
          <div class="stat-label">${card.label}</div>
          <div class="stat-value">${card.value}</div>
        </div>
      `).join('');
    }

    function renderProfile() {
      const profile = state.profile || {};
      const assignedHouse = profile.assigned_house || profile.assignedHouse || (['tenant', 'user'].includes(state.role) ? state.houses[0] : null) || null;

      const values = [
        ['Name', profile.name || 'Not provided'],
        ['Email', profile.email || 'Not provided'],
        ['Role', formatRole(state.role)],
        ['House', assignedHouse ? assignedHouse.name : 'No assigned house'],
        ['Location', assignedHouse ? (assignedHouse.location || 'N/A') : 'N/A']
      ];

      profilePanel.innerHTML = values.map(([label, value]) => `
        <div class="profile-line">
          <span class="label">${label}</span>
          <strong>${value}</strong>
        </div>
      `).join('');
    }

    function renderHouseList() {
      if (!state.houses.length) {
        mainPanelContent.innerHTML = '<div class="empty">No houses available for this account.</div>';
        return;
      }

      const cards = state.houses.map(house => `
        <div class="house-card">
          <div class="tag">House</div>
          <h3>${house.name || 'Unnamed House'}</h3>
          <div class="meta">${house.location || 'No location'}<br />Owner ID: ${house.owner_id || 'N/A'}</div>
          <div class="inline-actions">
            <button class="mini-btn" data-house-id="${house.id}" data-action="select-house">View Devices</button>
          </div>
        </div>
      `).join('');

      mainPanelContent.innerHTML = `<div class="card-grid">${cards}</div>`;

      document.querySelectorAll('[data-action="select-house"]').forEach(button => {
        button.addEventListener('click', () => {
          const houseId = Number(button.dataset.houseId);
          state.selectedHouseId = houseId;
          state.activeView = 'devices';
          renderViewTabs();
          renderMainPanel();
        });
      });
    }

    function renderTenantList() {
      if (!state.tenants.length) {
        mainPanelContent.innerHTML = '<div class="empty">No tenants assigned to this account scope.</div>';
        return;
      }

      const html = state.tenants.map(tenant => `
        <div class="tenant-card">
          <h3>${tenant.name || tenant.email || 'Tenant'}</h3>
          <div class="meta">${tenant.email || 'No email'}<br />Unit: ${tenant.leased_unit || 'N/A'}<br />Rent: ${tenant.rent_amount || 'N/A'}</div>
          <div class="tag">Tenant</div>
        </div>
      `).join('');

      mainPanelContent.innerHTML = `<div class="card-grid">${html}</div>`;
    }

    function renderDeviceList() {
      const selectedHouseId = state.selectedHouseId || (state.houses[0] && state.houses[0].id);
      const visibleDevices = state.devices.filter(device => {
        if (!selectedHouseId) return true;
        return Number(device.house_id) === Number(selectedHouseId);
      });

      if (!visibleDevices.length) {
        mainPanelContent.innerHTML = '<div class="empty">No devices available for the selected house.</div>';
        return;
      }

      const cards = visibleDevices.map(device => `
        <div class="device-card">
          <h3>${device.device_name || `Device ${device.id}`}</h3>
          <div class="meta">Type: ${device.device_type || 'Unknown'}<br />House ID: ${device.house_id || 'N/A'}</div>
          <span class="device-status ${device.status === 'online' || device.status === 'active' ? 'online' : 'offline'}">
            ${device.status || 'offline'}
          </span>
        </div>
      `).join('');

      mainPanelContent.innerHTML = `<div class="card-grid">${cards}</div>`;
    }

    function renderOverviewPanel() {
      const role = state.role;
      mainPanelTitle.textContent = role === 'admin' ? 'Admin Overview' : role === 'owner' ? 'Owner Overview' : 'Assigned Access';

      if (role === 'admin' || role === 'owner') {
        renderHouseList();
        if (state.tenants.length) {
          const panel = document.createElement('div');
          panel.className = 'card-grid';
          panel.innerHTML = state.tenants.map(tenant => `
            <div class="tenant-card">
              <h3>${tenant.name || tenant.email || 'Tenant'}</h3>
              <div class="meta">${tenant.email || 'No email'}<br />Unit: ${tenant.leased_unit || 'N/A'}<br />Rent: ${tenant.rent_amount || 'N/A'}</div>
              <div class="tag">Tenant</div>
            </div>
          `).join('');
          mainPanelContent.appendChild(panel);
        }
        return;
      }

      if (!state.houses.length) {
        mainPanelContent.innerHTML = '<div class="empty">No house assignment found for this account.</div>';
        return;
      }

      const cards = state.houses.map(house => `
        <div class="house-card">
          <div class="tag">House</div>
          <h3>${house.name || 'Assigned House'}</h3>
          <div class="meta">${house.location || 'No location'}<br />Owner: ${house.owner_id || 'N/A'}</div>
          <div class="inline-actions">
            <button class="mini-btn" data-house-id="${house.id}" data-action="select-house">View Devices</button>
          </div>
        </div>
      `).join('');

      mainPanelContent.innerHTML = `<div class="card-grid">${cards}</div>`;
      document.querySelectorAll('[data-action="select-house"]').forEach(button => {
        button.addEventListener('click', () => {
          const houseId = Number(button.dataset.houseId);
          state.selectedHouseId = houseId;
          state.activeView = 'devices';
          renderViewTabs();
          renderMainPanel();
        });
      });
    }

    function renderMainPanel() {
      const role = state.role;
      mainPanelContent.innerHTML = '';

      if (!state.activeView || !getRoleViews().includes(state.activeView)) {
        state.activeView = 'overview';
      }

      if (state.activeView === 'houses') {
        mainPanelTitle.textContent = role === 'admin' ? 'All Houses' : role === 'owner' ? 'My Houses' : 'Assigned Houses';
        renderHouseList();
        return;
      }

      if (state.activeView === 'tenants') {
        mainPanelTitle.textContent = 'Tenants';
        renderTenantList();
        return;
      }

      if (state.activeView === 'devices') {
        mainPanelTitle.textContent = 'Devices';
        renderDeviceList();
        return;
      }

      renderOverviewPanel();
    }

    async function loadDashboardData() {
      const headers = getAuthHeaders();
      state.devices = [];
      state.tenants = [];

      try {
        const housesResponse = await fetch(`${API_BASE}/api/houses`, { headers });
        const housesData = await housesResponse.json();
        state.houses = Array.isArray(housesData.houses) ? housesData.houses : (Array.isArray(housesData) ? housesData : []);

        if (state.role === 'admin' || state.role === 'owner') {
          const tenantsResponse = await fetch(`${API_BASE}/api/tenants`, { headers });
          const tenantsData = await tenantsResponse.json();
          state.tenants = Array.isArray(tenantsData.tenants) ? tenantsData.tenants : [];
        }

        if (state.houses.length) {
          const visibleHouseId = state.selectedHouseId || state.houses[0].id;
          state.selectedHouseId = visibleHouseId;
          for (const house of state.houses) {
            const devicesResponse = await fetch(`${API_BASE}/api/houses/${house.id}/devices`, { headers });
            const devicesData = await devicesResponse.json();
            const devices = Array.isArray(devicesData.devices) ? devicesData.devices : [];
            state.devices = [...state.devices, ...devices];
          }
        }

        renderStats();
        renderProfile();
        renderViewTabs();
        renderMainPanel();
      } catch (error) {
        console.error('Dashboard load error:', error);
        mainPanelContent.innerHTML = '<div class="empty">Unable to load dashboard data.</div>';
      }
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        showAlert(loginAlert, 'Email and password are required.', 'error');
        return;
      }

      loginBtn.disabled = true;
      clearAlert(loginAlert);

      try {
        const loginResponse = await requestJson(`${API_BASE}/api/login`, {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        state.jwt = loginResponse.accessToken;
        const meResponse = await fetch(`${API_BASE}/api/me`, {
          method: 'GET',
          headers: getAuthHeaders()
        });

        const meData = meResponse.ok ? await meResponse.json() : null;
        if (!meData || !meData.user) {
          throw new Error('Could not load user profile');
        }

        state.profile = meData.user;
        state.role = String(meData.user.role || 'user').toLowerCase();
        state.activeView = 'overview';
        userDisplayName.textContent = meData.user.name || meData.user.email || 'User';
        userRole.textContent = formatRole(state.role);

        renderViewTabs();
        setActiveScreen('dashboard');
        clearAlert(passwordAlert);
        await loadDashboardData();
      } catch (error) {
        showAlert(loginAlert, error.message || 'Login failed.', 'error');
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function handleLogout() {
      state.jwt = '';
      state.profile = null;
      state.role = null;
      state.houses = [];
      state.tenants = [];
      state.devices = [];
      state.selectedHouseId = null;
      state.activeView = 'overview';
      document.getElementById('email').value = 'admin@example.com';
      document.getElementById('password').value = 'AdminPass123!';
      clearAlert(loginAlert);
      clearAlert(passwordAlert);
      setActiveScreen('login');
    }

    async function handlePasswordUpdate(event) {
      event.preventDefault();
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;

      if (!oldPassword || !newPassword) {
        showAlert(passwordAlert, 'Both current and new password are required.', 'error');
        return;
      }

      try {
        const result = await requestJson(`${API_BASE}/api/update_password`, {
          method: 'POST',
          body: JSON.stringify({
            token: state.jwt,
            oldPassword,
            newPassword
          })
        });

        showAlert(passwordAlert, result.message || 'Password updated successfully.', 'success');
        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
      } catch (error) {
        showAlert(passwordAlert, error.message || 'Password update failed.', 'error');
      }
    }

    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    document.getElementById('logoutBtn').addEventListener('click', handleLogout);
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      state.devices = [];
      state.tenants = [];
      await loadDashboardData();
    });
    document.getElementById('passwordForm').addEventListener('submit', handlePasswordUpdate);

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && loginScreen.classList.contains('active')) {
        handleLogin();
      }
    });
  </script>
</body>
</html>
